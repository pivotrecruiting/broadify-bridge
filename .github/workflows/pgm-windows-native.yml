name: PGM Windows Native

# Compile + ctest for the Windows side of the live program preview (ADR-0009,
# docs/bridge/features/pgm-live-preview-windows.md). Runs on the stacked
# feature/pgm-win-* branches and manually; it never builds or publishes a
# release. Green here means "compiles and the tests pass on a hosted runner",
# not "verified on hardware".
#
# Jobs:
#   core     pure modules only (pgm_core, live_stream_core, helper_common):
#            no WebRTC, no encoder, no network dependency. Configured without
#            any switch, i.e. what a Windows release compiles today.
#   encoder  Media Foundation H.264 encoder (LIVE_STREAM_WITH_MF=ON, still no
#            WebRTC/OpenSSL): compiles mf_encoder.cpp and runs it against an
#            in-test asynchronous MFT and, through the test seam only, against
#            Microsoft's software encoder MFT. The hosted runner has no GPU,
#            so the hardware smoke test reports "skipped" here.
#   full     the WebRTC part (LIVE_STREAM_WITH_WEBRTC=ON): static OpenSSL from
#            the vcpkg manifest, libdatachannel, publisher.cpp on top of the
#            encoder, and the in-process WebRTC loopback test. Then the helper
#            itself the way the build switch builds it (BROADIFY_PGM_WINDOWS=1
#            through scripts/build-pgm-helper.sh): pgm-helper.exe, ctest,
#            `--probe`, and a run with the synthetic source that must end in
#            `encoder_unavailable` on this GPU-less runner - the doctrine test:
#            no silent software fallback. The exe's imports go through the
#            release dependency gate and it is uploaded unsigned for the
#            device session. Network dependencies (OpenSSL, libdatachannel,
#            opus) are cached.
#   meeting  meeting-helper.exe in both configurations, each with its ctest
#            run, the way `dist:win` builds and tests it (matting backends on:
#            vendored ONNX Runtime, OpenVINO from the release's own script):
#            - default: no switch, exactly the release's two commands. Stub
#              program stream, nothing of the live program configured. This
#              is the Windows compile of every change under meeting-helper,
#              whichever branch it comes from.
#            - BROADIFY_PGM_WINDOWS=1: program_stream.cpp + NV12 frame
#              converter + WebRTC linked into the helper, plus the stream
#              tests (the worker end to end against an in-process viewer; on
#              this GPU-less runner the real encoder path must end in
#              `encoder_unavailable`).

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/pgm-win-**"
    paths:
      - apps/bridge/native/live-stream/**
      - apps/bridge/native/pgm-helper/**
      - apps/bridge/native/helper-common/**
      # Sources, tests, CMakeLists.txt and build.ps1 of the meeting helper,
      # and what its build compiles from the neighbouring directories.
      - apps/bridge/native/meeting-helper/**
      - apps/bridge/native/vcam-helper/Shared/**
      - apps/bridge/native/vcam-helper/windows/**
      - apps/bridge/native/framebus/include/**
      - scripts/prepare-windows-pgm-deps.ps1
      - scripts/build-pgm-helper.sh
      - scripts/build-meeting-helper.sh
      - scripts/prepare-windows-meeting-helper-deps.ps1
      - scripts/prepare-windows-openvino-deps.ps1
      - scripts/prepare-windows-vc-runtime.ps1
      - scripts/verify-windows-native-dependencies.cjs
      - scripts/lib/windows-native-dependency-policy.cjs
      - scripts/lib/windows-vc-runtime.cjs
      - .github/workflows/pgm-windows-native.yml

permissions:
  contents: read

concurrency:
  group: pgm-windows-native-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PGM_HELPER_DIR: apps/bridge/native/pgm-helper
  LIVE_STREAM_DIR: apps/bridge/native/live-stream
  MEETING_HELPER_DIR: apps/bridge/native/meeting-helper
  # Hosted runners have 4 cores; keep the same cap when run elsewhere.
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  core:
    name: core (pure modules, MSVC)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      # Pure modules + tests only: the helper binary (capture, encoder, WebRTC)
      # stays out of this job. The CMake files read these from the environment.
      PGM_HELPER_BUILD_BINARY: "0"
      PGM_HELPER_BUILD_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022

      # Windows Server ships Media Foundation as an optional feature. The pure
      # modules do not need it, but every later job does - fail early and in
      # one place if a runner image drops it.
      - name: Assert Media Foundation
        run: |
          $ErrorActionPreference = 'Stop'
          $mfplat = Join-Path $env:SystemRoot 'System32\mfplat.dll'
          if (-not (Test-Path $mfplat)) {
            Write-Host "mfplat.dll missing - trying Install-WindowsFeature Server-Media-Foundation"
            try {
              Install-WindowsFeature Server-Media-Foundation | Format-List
            } catch {
              Write-Host "Install-WindowsFeature failed: $_"
            }
          }
          if (-not (Test-Path $mfplat)) {
            throw "Media Foundation is not available on this runner ($mfplat missing; the feature may need a restart)."
          }
          Write-Host "Media Foundation present: $((Get-Item $mfplat).VersionInfo.FileVersion)"

      - name: Tool versions
        run: |
          cmake --version
          Write-Host "cl: $((Get-Command cl.exe).Source)"

      # FETCHCONTENT_FULLY_DISCONNECTED turns any accidental network
      # dependency of the pure modules into a configure error.
      - name: Configure pgm-helper (pure modules)
        run: >
          cmake -S $env:PGM_HELPER_DIR -B "$env:PGM_HELPER_DIR/build"
          -DLIVE_STREAM_WITH_WEBRTC=OFF
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON

      - name: Build pgm-helper (pure modules)
        run: cmake --build "$env:PGM_HELPER_DIR/build" --config Release

      - name: Test pgm-helper (pure modules)
        run: >
          ctest --test-dir "$env:PGM_HELPER_DIR/build" --build-config Release
          --timeout 120 --output-on-failure

      # The same core as a stand-alone project, the way the meeting helper
      # consumes it: catches anything that only works inside the pgm-helper tree.
      - name: Configure live-stream core
        run: >
          cmake -S $env:LIVE_STREAM_DIR -B "$env:LIVE_STREAM_DIR/build"
          -DLIVE_STREAM_WITH_WEBRTC=OFF
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON

      - name: Build live-stream core
        run: cmake --build "$env:LIVE_STREAM_DIR/build" --config Release

      - name: Test live-stream core
        run: >
          ctest --test-dir "$env:LIVE_STREAM_DIR/build" --build-config Release
          --timeout 120 --output-on-failure

  encoder:
    name: encoder (Media Foundation H.264, MSVC)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022

      - name: Assert Media Foundation
        run: |
          $ErrorActionPreference = 'Stop'
          $mfplat = Join-Path $env:SystemRoot 'System32\mfplat.dll'
          if (-not (Test-Path $mfplat)) {
            Write-Host "mfplat.dll missing - trying Install-WindowsFeature Server-Media-Foundation"
            try {
              Install-WindowsFeature Server-Media-Foundation | Format-List
            } catch {
              Write-Host "Install-WindowsFeature failed: $_"
            }
          }
          if (-not (Test-Path $mfplat)) {
            throw "Media Foundation is not available on this runner ($mfplat missing; the feature may need a restart)."
          }
          Write-Host "Media Foundation present: $((Get-Item $mfplat).VersionInfo.FileVersion)"
          $h264 = Join-Path $env:SystemRoot 'System32\mfh264enc.dll'
          Write-Host "Microsoft H.264 encoder MFT (test seam only): $(if (Test-Path $h264) { 'present' } else { 'missing - the seam test will skip' })"

      # The encoder needs neither WebRTC nor OpenSSL: still no network dependency.
      - name: Configure live-stream with the Media Foundation encoder
        run: >
          cmake -S $env:LIVE_STREAM_DIR -B "$env:LIVE_STREAM_DIR/build-mf"
          -DLIVE_STREAM_WITH_WEBRTC=OFF
          -DLIVE_STREAM_WITH_MF=ON
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON

      - name: Build live-stream with the Media Foundation encoder
        run: cmake --build "$env:LIVE_STREAM_DIR/build-mf" --config Release

      # Verbose on purpose: the log shows which tests skipped (no hardware
      # encoder MFT on hosted runners) and the settings each encoder accepted.
      - name: Test live-stream with the Media Foundation encoder
        run: >
          ctest --test-dir "$env:LIVE_STREAM_DIR/build-mf" --build-config Release
          --timeout 120 --output-on-failure --verbose

  full:
    name: full (WebRTC + static OpenSSL + pgm-helper.exe, MSVC)
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022

      - name: Assert Media Foundation
        run: |
          $ErrorActionPreference = 'Stop'
          $mfplat = Join-Path $env:SystemRoot 'System32\mfplat.dll'
          if (-not (Test-Path $mfplat)) {
            Write-Host "mfplat.dll missing - trying Install-WindowsFeature Server-Media-Foundation"
            try {
              Install-WindowsFeature Server-Media-Foundation | Format-List
            } catch {
              Write-Host "Install-WindowsFeature failed: $_"
            }
          }
          if (-not (Test-Path $mfplat)) {
            throw "Media Foundation is not available on this runner ($mfplat missing; the feature may need a restart)."
          }
          Write-Host "Media Foundation present: $((Get-Item $mfplat).VersionInfo.FileVersion)"

      # Static OpenSSL: built once per manifest/script change (several minutes),
      # afterwards the script short-circuits on the restored tree.
      - name: Cache static OpenSSL (vcpkg)
        uses: actions/cache@v4
        with:
          path: apps/bridge/native/live-stream/deps/vcpkg_installed
          key: pgm-win-openssl-${{ runner.os }}-${{ hashFiles('apps/bridge/native/live-stream/vcpkg.json', 'scripts/prepare-windows-pgm-deps.ps1') }}

      # The runner's own vcpkg checkout, not the one vcvars puts into VCPKG_ROOT.
      - name: Prepare static OpenSSL
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          ./scripts/prepare-windows-pgm-deps.ps1 -VcpkgRoot $vcpkgRoot

      # libdatachannel with its submodules: the pinned tag is read from the
      # CMake file, so the cache key and the clone follow it. The build then
      # uses the documented offline path (FETCHCONTENT_SOURCE_DIR_LIBDATACHANNEL).
      - name: Resolve libdatachannel tag
        id: ldc
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content -Raw "$env:LIVE_STREAM_DIR/CMakeLists.txt"
          $match = [regex]::Match($cmake, 'libdatachannel\.git\s+GIT_TAG\s+(\S+)')
          if (-not $match.Success) { throw "libdatachannel GIT_TAG not found in live-stream/CMakeLists.txt" }
          $tag = $match.Groups[1].Value
          Write-Host "libdatachannel $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Forward slashes: the path ends up in a CMake cache variable.
          $src = (Join-Path $env:RUNNER_TEMP 'libdatachannel-src').Replace('\', '/')
          "LIBDATACHANNEL_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache libdatachannel sources
        id: ldc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libdatachannel-src
          key: pgm-win-libdatachannel-${{ steps.ldc.outputs.tag }}

      - name: Fetch libdatachannel sources
        if: steps.ldc-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:LIBDATACHANNEL_SRC) { Remove-Item -Recurse -Force $env:LIBDATACHANNEL_SRC }
          git clone --depth 1 --branch "${{ steps.ldc.outputs.tag }}" --recurse-submodules --shallow-submodules `
            https://github.com/paullouisageneau/libdatachannel.git $env:LIBDATACHANNEL_SRC
          if ($LASTEXITCODE -ne 0) { throw "git clone libdatachannel failed with exit code $LASTEXITCODE" }

      - name: Tool versions
        run: |
          cmake --version
          Write-Host "cl: $((Get-Command cl.exe).Source)"

      - name: Configure live-stream with WebRTC
        run: >
          cmake -S $env:LIVE_STREAM_DIR -B "$env:LIVE_STREAM_DIR/build-full"
          -DLIVE_STREAM_WITH_WEBRTC=ON
          "-DFETCHCONTENT_SOURCE_DIR_LIBDATACHANNEL=$env:LIBDATACHANNEL_SRC"
          -DFETCHCONTENT_FULLY_DISCONNECTED=ON

      - name: Build live-stream with WebRTC
        run: cmake --build "$env:LIVE_STREAM_DIR/build-full" --config Release

      # ADR-0009, point 5: OpenSSL is linked statically, the test binary must
      # not import an OpenSSL DLL.
      - name: Assert no OpenSSL DLL import
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path "$env:LIVE_STREAM_DIR/build-full" -Recurse -Filter webrtc_loopback_test.exe | Select-Object -First 1
          if (-not $exe) { throw "webrtc_loopback_test.exe not found" }
          $imports = & dumpbin /dependents $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $imports | Write-Host
          $bad = @($imports | Where-Object { $_ -match '(?i)\b(libssl|libcrypto|ssleay|libeay|datachannel)[^\s]*\.dll' })
          if ($bad.Count -gt 0) { throw "unexpected DLL imports: $($bad -join ', ')" }

      - name: Test live-stream with WebRTC (all but the loopback test)
        run: >
          ctest --test-dir "$env:LIVE_STREAM_DIR/build-full" --build-config Release
          --timeout 120 --output-on-failure --verbose -E "^webrtc_loopback_test$"

      # ICE over UDP loopback on a shared runner: one retry for a lost
      # connectivity check, a second failure is a real one.
      - name: Test WebRTC loopback
        run: >
          ctest --test-dir "$env:LIVE_STREAM_DIR/build-full" --build-config Release
          --timeout 120 --output-on-failure --verbose -R "^webrtc_loopback_test$"
          --repeat until-pass:2 --no-tests=error

      # ---- pgm-helper.exe: what BROADIFY_PGM_WINDOWS=1 builds ----------------

      # Without the switch the wrapper must skip exactly as it does in a
      # release today: no build directory, no executable.
      - name: Build wrapper skips without the switch
        shell: bash
        run: |
          set -euo pipefail
          unset BROADIFY_PGM_WINDOWS
          output="$(bash scripts/build-pgm-helper.sh)"
          echo "$output"
          [[ "$output" == Skipping\ PGM\ helper\ build\ on\ * ]]
          [[ ! -e "$PGM_HELPER_DIR/pgm-helper.exe" ]]
          [[ ! -e "$PGM_HELPER_DIR/build" ]]

      # opus like libdatachannel: pinned tag read from the CMake file, sources
      # cached, build through the documented offline path.
      - name: Resolve opus tag
        id: opus
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content -Raw "$env:PGM_HELPER_DIR/CMakeLists.txt"
          $match = [regex]::Match($cmake, 'opus\.git\s+GIT_TAG\s+(\S+)')
          if (-not $match.Success) { throw "opus GIT_TAG not found in pgm-helper/CMakeLists.txt" }
          $tag = $match.Groups[1].Value
          Write-Host "opus $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $src = (Join-Path $env:RUNNER_TEMP 'opus-src').Replace('\', '/')
          "OPUS_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache opus sources
        id: opus-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opus-src
          key: pgm-win-opus-${{ steps.opus.outputs.tag }}

      - name: Fetch opus sources
        if: steps.opus-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:OPUS_SRC) { Remove-Item -Recurse -Force $env:OPUS_SRC }
          git clone --depth 1 --branch "${{ steps.opus.outputs.tag }}" https://github.com/xiph/opus.git $env:OPUS_SRC
          if ($LASTEXITCODE -ne 0) { throw "git clone opus failed with exit code $LASTEXITCODE" }

      # Through the wrapper, i.e. the path a build with the switch takes:
      # scripts/build-pgm-helper.sh -> pgm-helper/build.ps1 (helper + tests).
      - name: Build pgm-helper.exe (BROADIFY_PGM_WINDOWS=1)
        shell: bash
        env:
          BROADIFY_PGM_WINDOWS: "1"
        run: |
          set -euo pipefail
          export PGM_HELPER_CMAKE_EXTRA_ARGS="-DFETCHCONTENT_SOURCE_DIR_LIBDATACHANNEL=$LIBDATACHANNEL_SRC -DFETCHCONTENT_SOURCE_DIR_OPUS=$OPUS_SRC -DFETCHCONTENT_FULLY_DISCONNECTED=ON"
          bash scripts/build-pgm-helper.sh
          test -f "$PGM_HELPER_DIR/pgm-helper.exe"

      - name: Test pgm-helper (all but the loopback test)
        run: >
          ctest --test-dir "$env:PGM_HELPER_DIR/build" --build-config Release
          --timeout 120 --output-on-failure -E "^webrtc_loopback_test$"

      - name: Test pgm-helper WebRTC loopback
        run: >
          ctest --test-dir "$env:PGM_HELPER_DIR/build" --build-config Release
          --timeout 120 --output-on-failure -R "^webrtc_loopback_test$"
          --repeat until-pass:2 --no-tests=error

      # The runner has no camera: the probe must still answer with one JSON
      # line, an empty input list and exit code 0.
      - name: pgm-helper.exe --probe
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:PGM_HELPER_DIR 'pgm-helper.exe'
          $output = @(& $exe --probe)
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -ne 0) { throw "--probe exited with $code" }
          $line = $output | Where-Object { $_ -match '^\{"type":"probe"' } | Select-Object -First 1
          if (-not $line) { throw "no probe line on stdout" }
          $probe = $line | ConvertFrom-Json
          if ($null -eq $probe.inputs -or $null -eq $probe.inputs.camera_permission) { throw "probe line has no inputs.camera_permission" }
          if ($probe.encoder -ne 'mediafoundation') { throw "unexpected encoder field: $($probe.encoder)" }
          Write-Host "inputs: $(@($probe.inputs.inputs).Count), camera_permission: $($probe.inputs.camera_permission)"

      # Doctrine test (ADR-0002/0009): on a machine without a hardware H.264
      # encoder the helper reports encoder_unavailable and encodes nothing. It
      # stays controllable: status, snapshot (portable JPEG path), the
      # recorder stub's recording_unsupported and a clean shutdown are checked
      # over the control pipe, the way the bridge talks to it.
      - name: Synthetic source ends in encoder_unavailable (no software fallback)
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:PGM_HELPER_DIR 'pgm-helper.exe'
          $pipeName = "broadify-pgm-ci-$PID"
          $stdout = Join-Path $env:RUNNER_TEMP 'pgm-synthetic.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pgm-synthetic.stderr.log'
          $helper = Start-Process -FilePath $exe -PassThru -NoNewWindow `
            -ArgumentList @('--run', '--control-socket', "\\.\pipe\$pipeName", '--synthetic-source', '1280x720@30') `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          # Keeps the process handle open so ExitCode is readable after the exit.
          $null = $helper.Handle

          function Read-Events {
            if (-not (Test-Path $stdout)) { return @() }
            $stream = [System.IO.File]::Open($stdout, 'Open', 'Read', 'ReadWrite')
            try {
              $text = [System.IO.StreamReader]::new($stream).ReadToEnd()
            } finally {
              $stream.Dispose()
            }
            # A line the helper is still writing does not parse yet; the next poll sees it whole.
            return @($text -split "`r?`n" | Where-Object { $_ -match '^\{.*\}$' } | ForEach-Object {
              try { $_ | ConvertFrom-Json } catch { }
            })
          }
          function Invoke-Rpc([string]$method, [string]$params = '{}') {
            $client = [System.IO.Pipes.NamedPipeClientStream]::new('.', $pipeName, [System.IO.Pipes.PipeDirection]::InOut)
            try {
              $client.Connect(10000)
              $request = [System.Text.Encoding]::UTF8.GetBytes("{`"id`":`"ci`",`"method`":`"$method`",`"params`":$params}`n")
              $client.Write($request, 0, $request.Length)
              $client.Flush()
              $line = [System.IO.StreamReader]::new($client, [System.Text.Encoding]::UTF8).ReadLine()
            } finally {
              $client.Dispose()
            }
            if (-not $line) { throw "no answer to $method" }
            Write-Host "$method -> $(if ($line.Length -gt 400) { $line.Substring(0, 400) + '...' } else { $line })"
            return $line | ConvertFrom-Json
          }

          try {
            $deadline = (Get-Date).AddSeconds(60)
            $errorEvent = $null
            while (-not $errorEvent -and (Get-Date) -lt $deadline) {
              if ($helper.HasExited) { throw "pgm-helper.exe exited early with $($helper.ExitCode)" }
              Start-Sleep -Milliseconds 500
              $errorEvent = Read-Events | Where-Object { $_.type -eq 'pgm_error' } | Select-Object -First 1
            }
            $events = Read-Events
            $events | ForEach-Object { Write-Host ($_ | ConvertTo-Json -Compress -Depth 8) }
            if (-not $errorEvent) { throw "no pgm_error event within 60 s" }
            if ($errorEvent.code -ne 'encoder_unavailable') { throw "expected encoder_unavailable, got $($errorEvent.code)" }
            if ($events | Where-Object { $_.type -eq 'pgm_encoder_configured' }) { throw "an encoder was configured on a runner without a hardware encoder" }
            if (-not ($events | Where-Object { $_.type -eq 'pgm_signal' -and $_.signal.width -eq 1280 -and $_.signal.height -eq 720 })) {
              throw "the synthetic source delivered no 1280x720 signal"
            }

            $status = Invoke-Rpc 'pgm.status'
            if (-not $status.ok) { throw "pgm.status failed" }
            if ($status.result.state -ne 'error' -or $status.result.last_error.code -ne 'encoder_unavailable' -or $null -ne $status.result.encoder) {
              throw "status does not report encoder_unavailable without an encoder"
            }
            $snapshot = Invoke-Rpc 'pgm.snapshot' '{"quality":0.8}'
            if (-not $snapshot.ok -or $snapshot.result.width -ne 1280 -or $snapshot.result.height -ne 720 -or
                -not $snapshot.result.jpeg_base64.StartsWith('/9j/')) {
              throw "pgm.snapshot did not return a 1280x720 JPEG"
            }
            $recording = Invoke-Rpc 'pgm.recording.start' '{"file_path":"C:/unused/pgm.mp4"}'
            if ($recording.ok -or $recording.error.code -ne 'recording_unsupported') { throw "pgm.recording.start must answer recording_unsupported" }
            $shutdown = Invoke-Rpc 'control.shutdown'
            if (-not $shutdown.ok) { throw "control.shutdown failed" }
            if (-not $helper.WaitForExit(20000)) { throw "pgm-helper.exe did not exit within 20 s after control.shutdown" }
            if ($helper.ExitCode -ne 0) { throw "pgm-helper.exe exited with $($helper.ExitCode)" }
            $last = Read-Events | Select-Object -Last 1
            if ($last.type -ne 'shutdown' -or $last.reason -ne 'control_shutdown') { throw "last event is not the control_shutdown shutdown event" }
          } finally {
            if (-not $helper.HasExited) { Stop-Process -Id $helper.Id -Force }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
          }

      # ADR-0009, point 5 and the release gate: only inbox Windows DLLs and
      # the VC runtime that ships next to every helper, no OpenSSL DLL. The
      # exe is staged the way the package lays it out (resources/native/pgm-helper).
      - name: Verify pgm-helper.exe imports (release dependency gate)
        run: |
          $ErrorActionPreference = 'Stop'
          $resources = Join-Path $env:RUNNER_TEMP 'pgm-stage\resources'
          $helperDir = Join-Path $resources 'native\pgm-helper'
          # Stages the VC runtime first: the script empties its destination.
          ./scripts/prepare-windows-vc-runtime.ps1 -Destination $helperDir
          Copy-Item -Force (Join-Path $env:PGM_HELPER_DIR 'pgm-helper.exe') $helperDir
          $env:PGM_STAGE_RESOURCES = $resources
          # The gate's own function, pointed at the staged folder instead of the packaged helper list.
          $check = Join-Path $env:RUNNER_TEMP 'verify-pgm-helper-imports.cjs'
          @'
          const path = require("node:path");
          const { verifyNativeDependencies } = require(path.join(process.cwd(), "scripts", "verify-windows-native-dependencies.cjs"));
          verifyNativeDependencies({ resourcesDir: process.env.PGM_STAGE_RESOURCES, helperDirs: ["native/pgm-helper"] }).then(
            (result) => {
              for (const problem of result.problems) console.error(`[Deps] ${problem.file} -> ${problem.missing}`);
              console.log(`[Deps] inspected ${result.inspected} PE file(s), ${result.problems.length} unresolved import(s)`);
              process.exit(result.ok && result.inspected > 0 ? 0 : 1);
            },
            (error) => {
              console.error(error);
              process.exit(1);
            },
          );
          '@ | Set-Content -Path $check -Encoding utf8
          node $check
          if ($LASTEXITCODE -ne 0) { throw "pgm-helper.exe has imports outside Windows and the packaged VC runtime" }
          $imports = & dumpbin /NOLOGO /DEPENDENTS (Join-Path $helperDir 'pgm-helper.exe')
          $imports | Write-Host
          $bad = @($imports | Where-Object { $_ -match '(?i)\b(libssl|libcrypto|ssleay|libeay|datachannel|opus)[^\s]*\.dll' })
          if ($bad.Count -gt 0) { throw "unexpected DLL imports: $($bad -join ', ')" }

      # Unsigned, for the device session only (docs: runbook). Never a release artifact.
      - name: Upload pgm-helper.exe (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: pgm-helper-windows-x64-unsigned-${{ github.sha }}
          path: apps/bridge/native/pgm-helper/pgm-helper.exe
          if-no-files-found: error
          retention-days: 14

  meeting:
    name: meeting (${{ matrix.label }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      # The default configuration must report on its own, whatever the switch does.
      fail-fast: false
      matrix:
        include:
          - label: default, as a release builds it
            pgm_windows: "0"
          - label: BROADIFY_PGM_WINDOWS=1
            pgm_windows: "1"
    env:
      # As dist:win sets them (package.json): both matting backends are part
      # of every Windows release build of the helper. The OpenVINO one is
      # switched on by the step that provides its runtime.
      MEETING_HELPER_ENABLE_MODNET: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: 2022

      - name: Assert Media Foundation
        run: |
          $ErrorActionPreference = 'Stop'
          $mfplat = Join-Path $env:SystemRoot 'System32\mfplat.dll'
          if (-not (Test-Path $mfplat)) {
            Write-Host "mfplat.dll missing - trying Install-WindowsFeature Server-Media-Foundation"
            try {
              Install-WindowsFeature Server-Media-Foundation | Format-List
            } catch {
              Write-Host "Install-WindowsFeature failed: $_"
            }
          }
          if (-not (Test-Path $mfplat)) {
            throw "Media Foundation is not available on this runner ($mfplat missing; the feature may need a restart)."
          }
          Write-Host "Media Foundation present: $((Get-Item $mfplat).VersionInfo.FileVersion)"

      # The two dependency steps of release.yml. ONNX Runtime is vendored in
      # git: its script only checks the tree and returns.
      - name: ONNX Runtime DirectML (vendored)
        run: ./scripts/prepare-windows-meeting-helper-deps.ps1

      - name: Cache OpenVINO runtime
        uses: actions/cache@v4
        with:
          path: apps/bridge/native/meeting-helper/deps/openvino/windows-x64
          key: pgm-win-openvino-${{ runner.os }}-${{ hashFiles('scripts/prepare-windows-openvino-deps.ps1') }}

      # The release's own script: pinned archive, SHA-256 checked. A failed
      # download gets two more attempts. If the archive stays unreachable the
      # helper is still compiled, without the OpenVINO backend and with a
      # warning on the run: a third-party server must not take away the
      # Windows compile of everything else.
      - name: OpenVINO runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'apps/bridge/native/meeting-helper/deps/openvino/windows-x64'
          $prepared = (Test-Path "$runtime/lib/openvino.lib") -and (Test-Path "$runtime/bin/openvino.dll")
          for ($attempt = 1; $attempt -le 3 -and -not $prepared; $attempt++) {
            try {
              ./scripts/prepare-windows-openvino-deps.ps1
              $prepared = $true
            } catch {
              Write-Host "OpenVINO preparation failed (attempt $attempt): $_"
              if ($attempt -lt 3) { Start-Sleep -Seconds 20 }
            }
          }
          if ($prepared) {
            "MEETING_HELPER_ENABLE_OPENVINO=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            # Nothing half-prepared may end up in the cache.
            if (Test-Path $runtime) { Remove-Item -Recurse -Force $runtime }
            Write-Host "::warning title=OpenVINO runtime unavailable::meeting-helper is built without MEETING_HELPER_ENABLE_OPENVINO in this run; a release builds the OpenVINO backend."
            "MEETING_HELPER_ENABLE_OPENVINO=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      # ---- only with the switch: what the WebRTC part needs (as in job full) ----

      - name: Cache static OpenSSL (vcpkg)
        if: matrix.pgm_windows == '1'
        uses: actions/cache@v4
        with:
          path: apps/bridge/native/live-stream/deps/vcpkg_installed
          key: pgm-win-openssl-${{ runner.os }}-${{ hashFiles('apps/bridge/native/live-stream/vcpkg.json', 'scripts/prepare-windows-pgm-deps.ps1') }}

      - name: Prepare static OpenSSL
        if: matrix.pgm_windows == '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          ./scripts/prepare-windows-pgm-deps.ps1 -VcpkgRoot $vcpkgRoot

      - name: Resolve libdatachannel tag
        if: matrix.pgm_windows == '1'
        id: ldc
        run: |
          $ErrorActionPreference = 'Stop'
          $cmake = Get-Content -Raw "$env:LIVE_STREAM_DIR/CMakeLists.txt"
          $match = [regex]::Match($cmake, 'libdatachannel\.git\s+GIT_TAG\s+(\S+)')
          if (-not $match.Success) { throw "libdatachannel GIT_TAG not found in live-stream/CMakeLists.txt" }
          $tag = $match.Groups[1].Value
          Write-Host "libdatachannel $tag"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Forward slashes: the path ends up in a CMake cache variable.
          $src = (Join-Path $env:RUNNER_TEMP 'libdatachannel-src').Replace('\', '/')
          "LIBDATACHANNEL_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache libdatachannel sources
        if: matrix.pgm_windows == '1'
        id: ldc-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/libdatachannel-src
          key: pgm-win-libdatachannel-${{ steps.ldc.outputs.tag }}

      - name: Fetch libdatachannel sources
        if: matrix.pgm_windows == '1' && steps.ldc-cache.outputs.cache-hit != 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:LIBDATACHANNEL_SRC) { Remove-Item -Recurse -Force $env:LIBDATACHANNEL_SRC }
          git clone --depth 1 --branch "${{ steps.ldc.outputs.tag }}" --recurse-submodules --shallow-submodules `
            https://github.com/paullouisageneau/libdatachannel.git $env:LIBDATACHANNEL_SRC
          if ($LASTEXITCODE -ne 0) { throw "git clone libdatachannel failed with exit code $LASTEXITCODE" }

      - name: Tool versions
        run: |
          cmake --version
          Write-Host "cl: $((Get-Command cl.exe).Source)"
          Write-Host "node: $(node --version), npm: $(npm --version)"

      # ---- default: the two commands of dist:win, nothing else ----------------
      #   cross-env MEETING_HELPER_ENABLE_MODNET=1 MEETING_HELPER_ENABLE_OPENVINO=1 npm run build:meeting-helper
      #   npm run test:meeting-helper-native

      - name: Build meeting-helper.exe (default)
        if: matrix.pgm_windows != '1'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BROADIFY_PGM_WINDOWS) { throw "BROADIFY_PGM_WINDOWS must not be set in the default configuration" }
          npm run build:meeting-helper
          if ($LASTEXITCODE -ne 0) { throw "npm run build:meeting-helper failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:MEETING_HELPER_DIR 'meeting-helper.exe'))) { throw "meeting-helper.exe was not built" }

      # Builds every target of the build directory and runs ctest: what a
      # release runs before it packages the helper.
      - name: Build all targets and test (default)
        if: matrix.pgm_windows != '1'
        run: |
          $ErrorActionPreference = 'Stop'
          npm run test:meeting-helper-native
          if ($LASTEXITCODE -ne 0) { throw "npm run test:meeting-helper-native failed with exit code $LASTEXITCODE" }

      # Without the switch nothing of the live program may be configured or
      # compiled into the helper: no fetched dependency, no WebRTC, no encoder,
      # the stub as program stream.
      - name: Assert the default build contains nothing of the live program
        if: matrix.pgm_windows != '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:MEETING_HELPER_DIR 'build'
          if (Test-Path (Join-Path $build '_deps')) { throw "the default build fetched a dependency ($build/_deps exists)" }
          $cache = Get-Content -Raw (Join-Path $build 'CMakeCache.txt')
          if ($cache -match '(?m)^LIVE_STREAM_WITH_(WEBRTC|MF)\b') { throw "the default build has a live-stream switch in its CMake cache" }
          $objects = @(Get-ChildItem -Path $build -Recurse -File -Filter '*.obj' | ForEach-Object { $_.Name })
          Write-Host "$($objects.Count) object files"
          foreach ($forbidden in @('program_stream.obj', 'program_frame_converter_nv12.obj', 'encoder_info_json.obj', 'publisher.obj', 'mf_encoder.obj')) {
            if ($objects -contains $forbidden) { throw "$forbidden was compiled without the build switch" }
          }
          $helperObjects = @(Get-ChildItem -Path (Join-Path $build 'meeting-helper.dir') -Recurse -File -Filter '*.obj' | ForEach-Object { $_.Name })
          if ($helperObjects -notcontains 'program_stream_stub.obj') { throw "meeting-helper.exe was not built with the stub program stream" }
          $imports = & dumpbin /NOLOGO /DEPENDENTS (Join-Path $env:MEETING_HELPER_DIR 'meeting-helper.exe')
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $imports | Write-Host

      # ---- with the switch -----------------------------------------------------

      # The same entry point with the switch: build.ps1 then passes the WebRTC
      # arguments. libdatachannel comes from the cached sources (offline path).
      - name: Build meeting-helper.exe (BROADIFY_PGM_WINDOWS=1)
        if: matrix.pgm_windows == '1'
        env:
          BROADIFY_PGM_WINDOWS: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MEETING_HELPER_CMAKE_EXTRA_ARGS = "-DFETCHCONTENT_SOURCE_DIR_LIBDATACHANNEL=$env:LIBDATACHANNEL_SRC -DFETCHCONTENT_FULLY_DISCONNECTED=ON"
          npm run build:meeting-helper
          if ($LASTEXITCODE -ne 0) { throw "npm run build:meeting-helper failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:MEETING_HELPER_DIR 'meeting-helper.exe'))) { throw "meeting-helper.exe was not built" }

      - name: Build all targets (BROADIFY_PGM_WINDOWS=1)
        if: matrix.pgm_windows == '1'
        run: cmake --build "$env:MEETING_HELPER_DIR/build" --config Release

      - name: Assert the helper links the program stream
        if: matrix.pgm_windows == '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:MEETING_HELPER_DIR 'build'
          $helperObjects = @(Get-ChildItem -Path (Join-Path $build 'meeting-helper.dir') -Recurse -File -Filter '*.obj' | ForEach-Object { $_.Name })
          foreach ($required in @('program_stream.obj', 'program_frame_converter_nv12.obj')) {
            if ($helperObjects -notcontains $required) { throw "$required is not part of meeting-helper.exe" }
          }
          if ($helperObjects -contains 'program_stream_stub.obj') { throw "meeting-helper.exe still contains the stub program stream" }
          # ADR-0009, point 5: OpenSSL and libdatachannel are linked statically.
          $imports = & dumpbin /NOLOGO /DEPENDENTS (Join-Path $env:MEETING_HELPER_DIR 'meeting-helper.exe')
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $imports | Write-Host
          $bad = @($imports | Where-Object { $_ -match '(?i)\b(libssl|libcrypto|ssleay|libeay|datachannel)[^\s]*\.dll' })
          if ($bad.Count -gt 0) { throw "unexpected DLL imports: $($bad -join ', ')" }

      - name: Test (all but the loopback tests)
        if: matrix.pgm_windows == '1'
        run: >
          ctest --test-dir "$env:MEETING_HELPER_DIR/build" --build-config Release
          --output-on-failure -E "loopback_test$"

      # The stream worker against an in-process viewer, plus the publisher's
      # own loopback test. Verbose: the log shows the `encoder_unavailable`
      # status of the real encoder path on this GPU-less runner. One retry for
      # a lost connectivity check, a second failure is a real one.
      - name: Test program stream and WebRTC loopback
        if: matrix.pgm_windows == '1'
        run: >
          ctest --test-dir "$env:MEETING_HELPER_DIR/build" --build-config Release
          --output-on-failure --verbose -R "loopback_test$"
          --repeat until-pass:2 --no-tests=error

      # Last, it deletes the built exe on its way: a default build must refuse
      # this build directory instead of silently building the stream again.
      - name: Default build refuses a directory configured with the switch
        if: matrix.pgm_windows == '1'
        shell: bash
        run: |
          set -uo pipefail
          unset BROADIFY_PGM_WINDOWS
          output="$(bash scripts/build-meeting-helper.sh 2>&1)"
          code=$?
          echo "$output"
          if [[ $code -eq 0 ]]; then
            echo "::error::the default build accepted a build directory configured with BROADIFY_PGM_WINDOWS=1"
            exit 1
          fi
          # PowerShell wraps its error text: compare without whitespace.
          if ! tr -d ' \r\n' <<<"$output" | grep -q "wasconfiguredwithBROADIFY_PGM_WINDOWS=1"; then
            echo "::error::the default build failed for another reason"
            exit 1
          fi
